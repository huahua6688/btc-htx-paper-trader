name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 生产目标是 Node 24（package.json engines 与 README 部署步骤一致）。
      # CI 必须跑在同一个大版本上，不允许因为低版本能跑就放宽 engines。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Node version
        run: node --version
      - name: Tests
        run: npm test
      - name: Safety check
        run: npm run check:safety
